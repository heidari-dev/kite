[workspace]
resolver = "2"
members = ["crates/*", "apps/desktop"]

[workspace.package]
version = "0.1.0-rc.1"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
repository = "https://github.com/heidari-dev/kite"
rust-version = "1.92"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
