[package]
name = "kite-relay"
description = "Kite relay crate"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[dependencies]
# std would pull in ring; the default resolver needs only these four.
snow = { version = "0.10", default-features = false, features = ["use-blake2", "use-chacha20poly1305", "use-curve25519", "use-getrandom"] }
socket2 = "0.6"
subtle = "2.6"
tokio = { version = "1.53", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
yamux = "0.14"
zeroize = "1"

[dev-dependencies]
tokio = { version = "1.53", features = ["macros", "rt", "test-util"] }
