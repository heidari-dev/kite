[package]
name = "kite-cli"
description = "Kite command line client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "kite"
path = "src/main.rs"

[dependencies]
socket2 = "0.6"
tokio = { version = "1.53", features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
yamux = "0.14"

[dev-dependencies]
kite-relay = { path = "../kite-relay" }
tokio = { version = "1.53", features = ["test-util"] }
