[package]
name = "kite-cli"
description = "Kite command line client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "kite"
path = "src/main.rs"

[dependencies]
kite-ipc = { path = "../kite-ipc" }
kite-link = { path = "../kite-link" }
kite-relay = { path = "../kite-relay" }
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1.53", features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
yamux = "0.14"

[target.'cfg(any(target_os = "linux", windows))'.dependencies]
tokio = { version = "1.53", features = ["fs", "process", "rt-multi-thread"] }
tun = { version = "0.8.14", features = ["async"] }
tun2proxy = { version = "0.8.7", default-features = false, features = ["udpgw"] }

[target.'cfg(target_os = "linux")'.dependencies]
netlink-packet-route = "0.33"
rtnetlink = "0.23"

[target.'cfg(windows)'.dependencies]
# Checks that wintun.dll is signed by WireGuard LLC before it is loaded.
tun = { version = "0.8.14", features = ["async", "verify_binary_signature"] }
kite-win = { path = "../kite-win", version = "0.0.0" }

[dev-dependencies]
kite-relay = { path = "../kite-relay" }
tokio = { version = "1.53", features = ["test-util"] }
