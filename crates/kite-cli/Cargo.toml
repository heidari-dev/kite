[package]
name = "kite-cli"
description = "Kite command line client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "kite"
path = "src/main.rs"

[dependencies]
kite-ipc = { path = "../kite-ipc", version = "0.0.0" }
kite-link = { path = "../kite-link", version = "0.0.0" }
kite-relay = { path = "../kite-relay", version = "0.0.0" }
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1.53", features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
yamux = "0.14"

[target.'cfg(target_os = "linux")'.dependencies]
netlink-packet-route = "0.33"
rtnetlink = "0.23"
tokio = { version = "1.53", features = ["fs", "process", "rt-multi-thread"] }
tun = { version = "0.8.14", features = ["async"] }
tun2proxy = { version = "0.8.7", default-features = false, features = ["udpgw"] }

[dev-dependencies]
kite-relay = { path = "../kite-relay" }
tokio = { version = "1.53", features = ["test-util"] }
