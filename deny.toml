[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
allow = [
  "GPL-3.0-or-later",
  "GPL-3.0-only",
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  # GPL-compatible (FSF list); Slint's clipboard and tray crates use them.
  "BSL-1.0",
  "Unlicense",
]
# The TUN device crate used by tun2proxy. WTFPL is a GPL-compatible permissive license (FSF).
exceptions = [{ allow = ["WTFPL"], crate = "tun" }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
