name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Kite version or commit
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Computer OS and phone model/OS version
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove IP addresses, hostnames and anything private first.
      render: shell
