version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
    # tun2proxy's tproxy-config pins these; a newer minor in kite-cli alone puts two copies of each
    # in the Linux binary. Drop this once tun2proxy moves to the same versions.
    ignore:
      - dependency-name: rtnetlink
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: netlink-packet-route
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # The Rust image the container build stage is pinned to.
  - package-ecosystem: docker
    directory: /packaging/container
    schedule:
      interval: weekly
