name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Slint finds system fonts through fontconfig.
      - run: sudo apt-get install -y --no-install-recommends libfontconfig1-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends libfontconfig1-dev
      - run: cargo test --workspace

  # GitHub's macOS runners often fail to start on pull requests ("job was not acquired"), which
  # blocks unrelated PRs, so they run on main, weekly and by hand. A separate job (a job-level `if`
  # cannot read the matrix) with the matrix's check name: on a PR it reports "skipped", which
  # satisfies the required check. Move it back into the matrix when macOS support work starts.
  test-macos:
    name: test (macos-latest)
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo test --workspace

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz each parser for 10 seconds
        working-directory: crates/kite-relay
        run: |
          for target in socks5_request udpgw_frames noise_frames; do
            cargo +nightly fuzz run "$target" -- -max_total_time=10
          done
      - name: Fuzz the IPC request parser for 10 seconds
        working-directory: crates/kite-ipc
        run: cargo +nightly fuzz run ipc_request -- -max_total_time=10

  systemd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Exposure 1.9 when this was written; the threshold leaves a little room for newer checks.
      - run: systemd-analyze security --offline=true --threshold=25 packaging/linux/kite.service
      - run: systemd-analyze security --offline=true packaging/linux/kite.service | tail -1

  tun:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: command -v dig capsh || sudo apt-get install -y --no-install-recommends bind9-dnsutils libcap2-bin
      - run: cargo build --release -p kite-cli
      - run: cargo build --release -p kite-relay --example relay-dev
      - run: ls -l target/release/kite
      - name: TUN mode end to end
        run: sudo bash scripts/tun-e2e.sh target/release/kite target/release/examples/relay-dev


  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build the Rust library and its Kotlin bindings
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" apps/android/build-rust.sh
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "9.9.1"
      - name: Build the debug APK
        working-directory: apps/android
        run: gradle --no-daemon assembleDebug
      - name: Sizes
        run: ls -l apps/android/app/src/main/jniLibs/*/libkite_ffi.so apps/android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kite-debug-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
