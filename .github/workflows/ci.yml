name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Pull requests that change only documentation skip the slow build, test and package jobs. Pushes
  # to main, the weekly run and manual runs always run everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ]; then
            # HEAD is the merge commit, so its first parent is the base branch.
            files=$(git diff --name-only HEAD^1 HEAD)
            grep -qvE '^(docs|site)/|\.md$|^(LICENSE|osv-scanner\.toml)$' <<<"$files" || code=false
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Slint finds system fonts through fontconfig.
      - run: sudo apt-get install -y --no-install-recommends libfontconfig1-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # The Windows-only code (kite-win, the pipe, TUN mode) is not built on Linux.
  clippy-windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ipstack's build script copies wintun.dll into target\debug\examples and fails when a
      # check-only build has not made that folder yet.
      - run: New-Item -ItemType Directory -Force target\debug\examples
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # Branch protection requires each "test (OS)" check, and a skipped matrix job reports none of
  # them. So this job always runs; on a docs-only pull request it runs on Linux and skips its steps.
  test:
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ needs.changes.outputs.code == 'true' && matrix.os || 'ubuntu-latest' }}
    steps:
      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: needs.changes.outputs.code == 'true' && runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends libfontconfig1-dev
      - if: needs.changes.outputs.code == 'true'
        run: cargo test --workspace

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  fuzz:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz each parser for 10 seconds
        working-directory: crates/kite-relay
        run: |
          for target in socks5_request udpgw_frames noise_frames; do
            cargo +nightly fuzz run "$target" -- -max_total_time=10
          done
      - name: Fuzz the IPC request parser for 10 seconds
        working-directory: crates/kite-ipc
        run: cargo +nightly fuzz run ipc_request -- -max_total_time=10
      - name: Fuzz the mDNS, ADB packet and usbmuxd reply parsers for 10 seconds
        working-directory: crates/kite-link
        run: |
          for target in mdns_response adb_packet usbmux_plist; do
            cargo +nightly fuzz run "$target" -- -max_total_time=10
          done

  systemd:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Exposure 1.9 when this was written; the threshold leaves a little room for newer checks.
      - run: systemd-analyze security --offline=true --threshold=25 packaging/linux/kite.service
      - run: systemd-analyze security --offline=true packaging/linux/kite.service | tail -1

  tun:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: command -v dig capsh || sudo apt-get install -y --no-install-recommends bind9-dnsutils libcap2-bin
      - run: cargo build --release -p kite-cli
      - run: cargo build --release -p kite-relay --example relay-dev
      - run: ls -l target/release/kite
      - name: TUN mode end to end
        run: sudo bash scripts/tun-e2e.sh target/release/kite target/release/examples/relay-dev


  # The runner is an administrator, so Wintun can make its adapter and the routes can change.
  tun-windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo build --release --locked -p kite-cli
      - run: cargo build --release --locked -p kite-relay --example relay-dev
      - run: scripts\fetch-wintun.ps1 target\release
      - name: TUN mode smoke test
        run: scripts\tun-smoke.ps1 target\release\kite.exe target\release\examples\relay-dev.exe

  # The runner has passwordless sudo, so a utun device can be made and the routes and DNS settings
  # can change. The macOS-only code is linted here, since the Linux and Windows jobs do not build it.
  macos:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: plutil -lint packaging/macos/*.plist
      - run: cargo build --release --locked -p kite-cli
      - run: cargo build --release --locked -p kite-relay --example relay-dev
      - name: TUN mode smoke test
        run: sudo bash scripts/tun-smoke-macos.sh target/release/kite target/release/examples/relay-dev

  # The macOS package: built as a universal binary, installed on the runner (its postinstall loads
  # the daemon), used by an administrator, then taken off again with its own uninstall script.
  pkg-macos:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/build-macos.sh
      - run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "kite-cli") | .version')
          scripts/package-macos.sh "$version" target/universal dist
      - name: Install, use, uninstall
        run: sudo bash scripts/test-pkg-macos.sh dist/Kite-*.pkg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kite-macos-package
          path: dist/*.pkg
          retention-days: 14

  # The installer: installs it on the runner, runs the TUN smoke test against the installed service
  # (with its cut-down token), uninstalls it and checks that nothing is left.
  msi-windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo build --release --locked -p kite-cli -p kite-desktop
      - run: cargo build --release --locked -p kite-relay --example relay-dev
      - run: scripts\fetch-wintun.ps1 target\wintun
      - run: scripts\fetch-adb.ps1 target\adb
      - name: Build the installer
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages | Where-Object name -eq kite-cli | ForEach-Object version
          scripts\build-msi.ps1 -Version $version -Bin target\release -Wintun target\wintun -Adb target\adb -Out dist
      - name: Install, test the service, uninstall
        run: scripts\msi-test.ps1 (Get-ChildItem dist\*.msi).FullName target\release\examples\relay-dev.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kite-windows-installer
          path: dist/*.msi
          retention-days: 14

  android:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build the Rust library and its Kotlin bindings
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" apps/android/build-rust.sh
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "9.9.1"
      - name: Build the debug APK
        working-directory: apps/android
        run: gradle --no-daemon assembleDebug
      # Without a signing key this is an unsigned APK; the release workflow signs it.
      - name: Build the release APK
        working-directory: apps/android
        run: gradle --no-daemon assembleRelease
      - name: Sizes
        run: ls -l apps/android/app/src/main/jniLibs/*/libkite_ffi.so apps/android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kite-debug-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  # Built on the oldest Ubuntu we run so the binaries only need its glibc.
  linux-packages:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get install -y --no-install-recommends libfontconfig1-dev squashfs-tools desktop-file-utils shellcheck
      - run: shellcheck scripts/*.sh packaging/linux/deb/* packaging/linux/appimage/AppRun
      - run: desktop-file-validate packaging/linux/kite.desktop packaging/linux/kite-autostart.desktop
      - run: cargo build --release --locked -p kite-cli -p kite-desktop
      - name: Build the packages
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "kite-cli") | .version')
          scripts/package-linux.sh "$version" dist
      - name: The AppImage runs
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1
          dist/Kite-*.AppImage --cli --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kite-linux-packages
          path: dist/
          retention-days: 14

  # On a machine with systemd: the daemon starts and stops with the package.
  deb-systemd:
    needs: linux-packages
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kite-linux-packages
          path: dist
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends desktop-file-utils
      - run: sudo bash scripts/test-deb.sh dist/kite_*.deb

  # On Debian, where the package must find every library it needs and the window must open.
  deb-debian:
    needs: linux-packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kite-linux-packages
          path: dist
      - name: Install, check and remove in a Debian 12 container
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src debian:12@sha256:268fb24c39bca92d326dd83ea3abebe4a3f7751c804ffef23bb6d857dd343ff8 bash -c '
            apt-get update &&
            apt-get install -y --no-install-recommends xvfb xauth desktop-file-utils fonts-dejavu-core procps &&
            bash scripts/test-deb.sh dist/kite_*.deb'
