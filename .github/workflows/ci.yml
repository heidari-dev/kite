name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo test --workspace

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz each parser for 10 seconds
        working-directory: crates/kite-relay
        run: |
          for target in socks5_request udpgw_frames; do
            cargo +nightly fuzz run "$target" -- -max_total_time=10
          done

  tun:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: command -v dig capsh || sudo apt-get install -y --no-install-recommends bind9-dnsutils libcap2-bin
      - run: cargo build --release -p kite-cli
      - run: cargo build --release -p kite-relay --example relay-dev
      - run: ls -l target/release/kite
      - name: TUN mode end to end
        run: sudo bash scripts/tun-e2e.sh target/release/kite target/release/examples/relay-dev

  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: |
          git worktree add /tmp/base origin/main
          (cd /tmp/base && cargo build -q --release -p kite-cli)
          cargo build -q --release -p kite-cli
          cargo build -q --release -p kite-relay --example relay-dev
          ls -l /tmp/base/target/release/kite target/release/kite
          target/release/examples/relay-dev 127.0.0.1:7000 &
          sleep 1
          for k in /tmp/base/target/release/kite target/release/kite; do
            $k connect --tcp 127.0.0.1:7000 --listen 127.0.0.1:1080 & pid=$!
            sleep 1
            echo "$k idle: $(grep VmRSS /proc/$pid/status)"
            for i in $(seq 20); do curl -s --max-time 30 --socks5-hostname 127.0.0.1:1080 -o /dev/null "https://speed.cloudflare.com/__down?bytes=2000000" & done
            sleep 2
            echo "$k 20 downloads: $(grep VmRSS /proc/$pid/status)"
            sleep 20
            echo "$k after: $(grep VmRSS /proc/$pid/status)"
            kill $pid; sleep 1
          done
