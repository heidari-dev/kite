name: Gradle verification metadata
on:
  push:
    branches: [chore/android-build-deps]
permissions:
  contents: read
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" apps/android/build-rust.sh
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "9.9.1"
          cache-disabled: true
      - name: Regenerate from scratch
        working-directory: apps/android
        run: |
          rm gradle/verification-metadata.xml
          gradle --no-daemon --refresh-dependencies --write-verification-metadata sha256 help assembleDebug assembleRelease
          gradle --no-daemon buildEnvironment | grep -E "guava|commons-lang3|httpclient|jose4j|bc(prov|pkix|util)|jdom2|kotlin-gradle-plugin:" | sort -u
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-metadata
          path: apps/android/gradle/verification-metadata.xml
