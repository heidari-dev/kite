name: Release

# Runs only when a v* tag is pushed. Everything is built here from the tagged commit; nothing is
# uploaded by hand. It ends in a draft release that you look at and publish. See docs/releasing.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: v
        env:
          TAG: ${{ github.ref_name }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || fail "The tag $TAG is not vMAJOR.MINOR.PATCH."
          version=${TAG#v}
          cargo=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "kite-cli") | .version')
          android=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' apps/android/app/build.gradle.kts)
          [[ $cargo == "$version" ]] || fail "The tag says $version but Cargo.toml says $cargo. Bump the version, merge it, and tag again."
          [[ $android == "$version" ]] || fail "The tag says $version but the Android versionName says $android."
          git branch -r --contains "$GITHUB_SHA" | grep -qx '  origin/main' || fail "The tagged commit is not on main."
          echo "version=$version" >>"$GITHUB_OUTPUT"

  linux:
    needs: check
    # The oldest Ubuntu we support, so the binaries only need its glibc.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get install -y --no-install-recommends libfontconfig1-dev squashfs-tools
      - run: cargo build --release --locked -p kite-cli -p kite-desktop
      - name: Build the packages
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          # In a Debian version a hyphen starts the revision, so 0.2.0-rc.1 would sort after 0.2.0.
          scripts/package-linux.sh "${VERSION/-/\~}" dist
          for f in dist/*; do n=${f//\~/-}; [[ $f == "$n" ]] || mv "$f" "$n"; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: dist/
          retention-days: 7

  android:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build the Rust library and its Kotlin bindings
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" apps/android/build-rust.sh
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "9.9.1"
      - name: Build the signed APK
        working-directory: apps/android
        env:
          VERSION: ${{ needs.check.outputs.version }}
          KITE_KEYSTORE_B64: ${{ secrets.KITE_KEYSTORE_B64 }}
          KITE_KEYSTORE_PASSWORD: ${{ secrets.KITE_KEYSTORE_PASSWORD }}
          KITE_KEY_ALIAS: ${{ secrets.KITE_KEY_ALIAS }}
          KITE_KEY_PASSWORD: ${{ secrets.KITE_KEY_PASSWORD }}
        run: |
          missing=0
          for name in KITE_KEYSTORE_B64 KITE_KEYSTORE_PASSWORD KITE_KEY_ALIAS KITE_KEY_PASSWORD; do
            if [[ -z ${!name} ]]; then
              echo "::error::The secret $name is not set. See docs/releasing.md."
              missing=1
            fi
          done
          [[ $missing == 0 ]] || exit 1

          umask 077
          export KITE_KEYSTORE_FILE=$RUNNER_TEMP/kite-release.jks
          trap 'rm -f "$KITE_KEYSTORE_FILE"' EXIT
          printf '%s' "$KITE_KEYSTORE_B64" | base64 -d >"$KITE_KEYSTORE_FILE" ||
            { echo "::error::KITE_KEYSTORE_B64 is not base64. See docs/releasing.md."; exit 1; }
          keytool -list -keystore "$KITE_KEYSTORE_FILE" -storepass:env KITE_KEYSTORE_PASSWORD \
            -alias "$KITE_KEY_ALIAS" >/dev/null 2>&1 ||
            { echo "::error::The keystore, its password or the key alias is wrong. See docs/releasing.md."; exit 1; }

          gradle --no-daemon assembleRelease

          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          apk=app/build/outputs/apk/release/app-release.apk
          # Prints the signer's certificate digest, which is public; the key itself never leaves the keystore.
          "$apksigner" verify --verbose --print-certs "$apk"
          mkdir -p ../../dist
          cp "$apk" "../../dist/kite-$VERSION.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: dist/
          retention-days: 7

  sbom:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo install cargo-cyclonedx --version 0.5.9 --locked
      - name: One CycloneDX file for each program we ship
        run: |
          cargo cyclonedx --format json --spec-version 1.5
          mkdir dist
          cp crates/kite-cli/kite-cli.cdx.json crates/kite-ffi/kite-ffi.cdx.json apps/desktop/kite-desktop.cdx.json dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: dist/
          retention-days: 7

  release:
    needs: [check, linux, android, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the draft release
      id-token: write # keyless signing
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: find . -type f ! -name SHA256SUMS -printf '%P\n' | LC_ALL=C sort | xargs sha256sum >SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: A Sigstore bundle for each file
        run: for f in dist/*; do cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"; done
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          scripts/release-notes.sh "$TAG" >notes.md
          # A hyphen in the version (v0.2.0-rc.1) marks a pre-release.
          pre=(); [[ $TAG == *-* ]] && pre=(--prerelease)
          gh release create "$TAG" dist/* --draft --verify-tag "${pre[@]}" --title "Kite $TAG" --notes-file notes.md
