[package]
name = "kite-desktop"
description = "Kite desktop app: a window and a tray icon for the Kite daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "kite-desktop"
path = "src/main.rs"

[dependencies]
kite-ipc = { path = "../../crates/kite-ipc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The software renderer keeps the window cheap: no GL context, no GPU buffers.
slint = { version = "1.18", default-features = false, features = [
  "std",
  "compat-1-2",
  "backend-winit",
  "backend-winit-x11",
  "backend-winit-wayland",
  "renderer-software",
  "software-renderer-systemfonts",
  "system-tray",
  "software-renderer-path",
  "accessibility",
] }
tokio = { version = "1.53", features = ["io-util", "net", "rt", "sync", "time", "macros"] }

[build-dependencies]
slint-build = "1.18"

[dev-dependencies]
tokio = { version = "1.53", features = ["test-util"] }
